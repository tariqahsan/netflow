<html>
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:#0a0e1a;color:#c8d8ff;overflow:hidden}
#header{position:fixed;top:0;left:0;right:0;z-index:2000;
  background:linear-gradient(90deg,#0d1b3e,#091225 60%,#0a0e1a);
  border-bottom:1px solid #1e3a6e;padding:8px 16px;
  display:flex;align-items:center;gap:16px}
#header h1{font-size:14px;font-weight:700;color:#4fc3f7;letter-spacing:2px;text-transform:uppercase}
.subtitle{font-size:11px;color:#5a7fa0;letter-spacing:1px}
.badge{background:#1a3a5c;border:1px solid #2a5a8c;border-radius:3px;padding:2px 8px;font-size:10px;color:#7ec8f8}
#stats-bar{display:flex;gap:20px;align-items:center}
.stat-item .val{font-size:13px;color:#4fc3f7;font-weight:700}
.stat-item .lbl{font-size:9px;color:#5a7fa0}
#map{position:fixed;top:42px;left:0;right:360px;bottom:0}
#sidebar{position:fixed;top:42px;right:0;width:360px;bottom:0;
  background:#0a0e1a;border-left:1px solid #1e3a6e;
  display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:12px 14px 8px;border-bottom:1px solid #1a2e4a;flex-shrink:0}
#sidebar-title{font-size:12px;color:#7ec8f8;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
#search-box{width:100%;background:#0d1b2e;border:1px solid #1e3a6e;
  color:#c8d8ff;padding:5px 8px;font-size:11px;border-radius:3px;font-family:inherit}
#search-box:focus{outline:none;border-color:#4fc3f7}
#filter-bar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.filter-btn{font-size:10px;padding:2px 8px;border-radius:2px;border:1px solid #1e3a6e;
  background:#0d1b2e;color:#7ec8f8;cursor:pointer;letter-spacing:1px}
.filter-btn.active{background:#1a3a5c;border-color:#4fc3f7;color:#4fc3f7}
#node-list{flex:1;overflow-y:auto}
#node-list::-webkit-scrollbar{width:4px}
#node-list::-webkit-scrollbar-thumb{background:#1e3a6e;border-radius:2px}
.node-item{padding:8px 14px;border-bottom:1px solid #0f1e30;cursor:pointer;
  transition:background .15s;display:flex;align-items:center;gap:8px}
.node-item:hover{background:#0d1b2e}
.node-item.selected{background:#0f2040;border-left:2px solid #4fc3f7}
.node-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node-dot.hub{background:#ff6b35}.node-dot.customer{background:#4fc3f7}.node-dot.intl{background:#ab47bc}
.node-name{font-size:10px;color:#c8d8ff;flex:1}
.node-ip{font-size:9px;color:#4fc3f7;white-space:nowrap}
.node-latency{font-size:10px;color:#5a9a6a;text-align:right;white-space:nowrap;min-width:44px}
.node-latency.high{color:#e57373}.node-latency.med{color:#ffb74d}
#detail-panel{border-top:1px solid #1a2e4a;flex-shrink:0;max-height:300px;overflow-y:auto;display:none}
#detail-panel::-webkit-scrollbar{width:4px}
#detail-panel::-webkit-scrollbar-thumb{background:#1e3a6e}
#detail-panel.visible{display:block}
.detail-header{background:#0d1b2e;padding:8px 14px;border-bottom:1px solid #1a2e4a;
  display:flex;align-items:center;justify-content:space-between}
.detail-node-name{font-size:12px;color:#4fc3f7;font-weight:700}
.detail-close{cursor:pointer;color:#5a7fa0;font-size:14px}
.detail-close:hover{color:#c8d8ff}
.detail-section{padding:8px 14px}
.detail-label{font-size:9px;color:#5a7fa0;letter-spacing:1.5px;text-transform:uppercase;margin:6px 0 3px}
.detail-value{font-size:11px;color:#c8d8ff}
.detail-ip{font-size:13px;color:#4fc3f7;font-weight:700}
.detail-stat-row{display:flex;gap:16px;margin-bottom:4px}
.detail-stat{text-align:center}
.detail-stat .val{font-size:16px;color:#4fc3f7;font-weight:700}
.detail-stat .lbl{font-size:9px;color:#5a7fa0;letter-spacing:1px}
.route-item{padding:5px 0;border-bottom:1px solid #0f1e30}
.route-item:last-child{border-bottom:none}
.ip-badge{display:inline-block;background:#0d2a3e;border:1px solid #1e5a6e;
  border-radius:3px;padding:1px 6px;font-size:9px;color:#4fc3f7;white-space:nowrap;
  margin:1px 0}
.hop-arrow{color:#5a7fa0;font-size:10px;margin:0 2px}
#legend{position:fixed;bottom:16px;left:16px;z-index:1500;
  background:rgba(10,14,26,.92);border:1px solid #1e3a6e;
  border-radius:4px;padding:10px 14px;font-size:10px}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.legend-line{width:24px;height:2px}
.legend-dot-sm{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<div id="header">
  <h1>DAI Application Routes</h1>
  <span class="subtitle">IP Trail &middot; All Customers &middot; Hop-by-Hop Latency</span>
  <div id="stats-bar" style="margin-left:auto">
    <div class="stat-item"><div class="val" id="stat-routes">-</div><div class="lbl">ROUTES</div></div>
    <div class="stat-item"><div class="val" id="stat-nodes">-</div><div class="lbl">NODES</div></div>
    <div class="stat-item"><div class="val" id="stat-avg">-</div><div class="lbl">AVG MS</div></div>
    <div class="badge">UURWMEA HUB</div>
  </div>
</div>
<div id="map"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <div id="sidebar-title">Customer Nodes &amp; IPs</div>
    <input id="search-box" type="text" placeholder="Search node name or IP address..." oninput="filterNodes()"/>
    <div id="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">ALL</button>
      <button class="filter-btn" onclick="setFilter('low',this)">LOW (&lt;3ms)</button>
      <button class="filter-btn" onclick="setFilter('med',this)">MED (3-7ms)</button>
      <button class="filter-btn" onclick="setFilter('high',this)">HIGH (&gt;7ms)</button>
    </div>
  </div>
  <div id="node-list"></div>
  <div id="detail-panel">
    <div class="detail-header">
      <span class="detail-node-name" id="detail-name">-</span>
      <span class="detail-close" onclick="closeDetail()">&#x2715;</span>
    </div>
    <div class="detail-section" id="detail-content"></div>
  </div>
</div>
<div id="legend">
  <div style="font-size:9px;color:#5a7fa0;letter-spacing:1.5px;margin-bottom:6px">LEGEND</div>
  <div class="legend-row"><div class="legend-dot-sm" style="background:#ff6b35"></div><span>Hub (UURWMEA)</span></div>
  <div class="legend-row"><div class="legend-dot-sm" style="background:#4fc3f7"></div><span>Customer Node</span></div>
  <div class="legend-row"><div class="legend-dot-sm" style="background:#ab47bc"></div><span>International</span></div>
  <div class="legend-row"><div class="legend-line" style="background:linear-gradient(90deg,#4fc3f7,transparent)"></div><span>Ant Trail Route</span></div>
  <div class="legend-row"><div class="legend-line" style="background:#e57373"></div><span>High Latency (&gt;7ms)</span></div>
</div>

const map = L.map('map',{center:[38.5,-95.0],zoom:4,preferCanvas:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
  subdomains:'abcd',maxZoom:20
}).addTo(map);

var antPaths=[],markers={},selectedNode=null,currentFilter='all',currentSearch='';

function latencyColor(ms){return ms<3?'#4fc3f7':ms<7?'#ffb74d':'#e57373';}
function latencyClass(ms){return ms<3?'':ms<7?'med':'high';}
function isIntl(n){return /_(GB|CY|DE|CA|RO)$/.test(n);}

var routeSummary={};
MAP_DATA.routes.forEach(function(r){
  if(!routeSummary[r.to]) routeSummary[r.to]={minMs:Infinity,maxMs:0,count:0,paths:[]};
  var s=routeSummary[r.to];
  s.minMs=Math.min(s.minMs,r.ms); s.maxMs=Math.max(s.maxMs,r.ms);
  s.count++; s.paths.push(r);
});

function drawRoutes(filter){
  antPaths.forEach(function(p){map.removeLayer(p);}); antPaths=[];
  var drawn={};
  MAP_DATA.routes.forEach(function(r){
    if(drawn[r.to]) return;
    if(filter==='low'&&r.ms>=3) return;
    if(filter==='med'&&(r.ms<3||r.ms>=7)) return;
    if(filter==='high'&&r.ms<7) return;
    drawn[r.to]=1;
    try{
      var p=L.polyline.antPath([[r.lat1,r.lng1],[r.lat2,r.lng2]],{
        color:latencyColor(r.ms),
        weight:r.ms>10?2.5:r.ms>5?1.8:1.2,
        opacity:0.7,
        delay:1200+Math.floor(Math.random()*800),
        dashArray:[10,20],
        pulseColor:'#ffffff'
      });
      p.addTo(map); antPaths.push(p);
    }catch(e){}
  });
}

function drawMarkers(){
  MAP_DATA.hubs.forEach(function(h){
    var n=MAP_DATA.nodes[h]; if(!n) return;
    var m=L.circleMarker([n.lat,n.lng],{radius:12,color:'#ff6b35',fillColor:'#ff6b35',fillOpacity:.9,weight:2}).addTo(map);
    m.bindPopup('<div style="font-family:monospace;font-size:12px;min-width:220px">'
      +'<b style="color:#e65100">'+h+'</b><br/>Hub Node &mdash; Fort Meade MD'
      +'<hr style="margin:4px 0"/>IP: <b style="color:#4fc3f7">'+(n.ip||'N/A')+'</b><br/>'
      +'Lat: '+n.lat.toFixed(4)+' Lng: '+n.lng.toFixed(4)+'<br/>Outbound: '+(n.out||0)+'</div>',{maxWidth:280});
    m.on('click',function(){selectNode(h);}); markers[h]=m;
  });
  var drawn={}; MAP_DATA.hubs.forEach(function(h){drawn[h]=1;});
  MAP_DATA.routes.forEach(function(r){
    var nm=r.to; if(drawn[nm]) return; drawn[nm]=1;
    var n=MAP_DATA.nodes[nm]; if(!n) return;
    var intl=isIntl(nm), c=intl?'#ab47bc':latencyColor(r.ms), s=routeSummary[nm]||{};
    var m=L.circleMarker([n.lat,n.lng],{radius:5,color:c,fillColor:c,fillOpacity:.85,weight:1.5}).addTo(map);
    m.bindPopup('<div style="font-family:monospace;font-size:11px;min-width:240px">'
      +'<b style="font-size:13px;color:#1565c0">'+nm+'</b><br/>'
      +(intl?'&#127757; International':'&#127482;&#127480; US DoD Site')
      +'<hr style="margin:4px 0"/>IP: <b style="color:#4fc3f7">'+(n.ip||'N/A')+'</b><br/>'
      +'<b>Min:</b> <span style="color:'+latencyColor(s.minMs||0)+'">'+( s.minMs||0).toFixed(3)+' ms</span><br/>'
      +'<b>Max:</b> <span style="color:'+latencyColor(s.maxMs||0)+'">'+( s.maxMs||0).toFixed(3)+' ms</span><br/>'
      +'<b>Routes:</b> '+(s.count||1)+'<br/>'
      +'<b>Coords:</b> '+n.lat.toFixed(3)+', '+n.lng.toFixed(3)
      +(s.paths&&s.paths.length?'<hr style="margin:4px 0"/>IP Trail:<br/>'
        +'<div style="font-size:9px;color:#4fc3f7;word-break:break-all;max-height:60px;overflow:hidden">'
        +s.paths[0].ip_path+'</div>':''),{maxWidth:340});
    m.on('click',function(){selectNode(nm);}); markers[nm]=m;
  });
}

var selectedNode=null;
function buildNodeList(){
  var q=currentSearch.toLowerCase(), f=currentFilter;
  var items=MAP_DATA.routes.filter(function(r){
    var n=MAP_DATA.nodes[r.to]||{};
    var ip=(n.ip||'').toLowerCase();
    if(r.to.toLowerCase().indexOf(q)<0 && ip.indexOf(q)<0) return false;
    if(f==='low'&&r.ms>=3) return false;
    if(f==='med'&&(r.ms<3||r.ms>=7)) return false;
    if(f==='high'&&r.ms<7) return false;
    return true;
  });
  var best={};
  items.forEach(function(r){if(!best[r.to]||r.ms<best[r.to].ms) best[r.to]=r;});
  items=Object.values(best).sort(function(a,b){return a.ms-b.ms;});
  document.getElementById('node-list').innerHTML=items.map(function(r){
    var n=MAP_DATA.nodes[r.to]||{};
    var intl=isIntl(r.to);
    return '<div class="node-item'+(selectedNode===r.to?' selected':'')+'" onclick="selectNode(\''+ r.to +'\')">'
      +'<div class="node-dot '+(intl?'intl':'customer')+'"></div>'
      +'<div style="flex:1;min-width:0"><div class="node-name">'+r.to+'</div>'
      +'<div class="node-ip">'+(n.ip||'')+'</div></div>'
      +'<span class="node-latency '+(r.ms<3?'':r.ms<7?'med':'high')+'">'+r.ms.toFixed(2)+'ms</span></div>';
  }).join('');
  var tot=items.reduce(function(s,r){return s+r.ms;},0);
  document.getElementById('stat-routes').textContent=items.length;
  document.getElementById('stat-nodes').textContent=Object.keys(MAP_DATA.nodes).length;
  document.getElementById('stat-avg').textContent=items.length?(tot/items.length).toFixed(1)+'ms':'-';
}

function filterNodes(){currentSearch=document.getElementById('search-box').value;buildNodeList();}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); buildNodeList(); drawRoutes(f);
}

function selectNode(name){
  selectedNode=name; buildNodeList();
  var n=MAP_DATA.nodes[name];
  if(n) map.flyTo([n.lat,n.lng],7,{duration:1.2});
  if(markers[name]) markers[name].openPopup();
  showDetail(name);
  document.querySelectorAll('.node-item').forEach(function(el){
    if(el.querySelector('.node-name').textContent===name)
      el.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

function showDetail(name){
  document.getElementById('detail-name').textContent=name;
  var node=MAP_DATA.nodes[name]||{}, nr=MAP_DATA.node_routes[name]||[];
  var minMs=nr.length?Math.min.apply(null,nr.map(function(r){return r.ms;})):0;
  var maxMs=nr.length?Math.max.apply(null,nr.map(function(r){return r.ms;})):0;
  document.getElementById('detail-content').innerHTML=
    '<div class="detail-stat-row">'
    +'<div class="detail-stat"><div class="val">'+minMs.toFixed(2)+'</div><div class="lbl">MIN MS</div></div>'
    +'<div class="detail-stat"><div class="val">'+maxMs.toFixed(2)+'</div><div class="lbl">MAX MS</div></div>'
    +'<div class="detail-stat"><div class="val">'+nr.length+'</div><div class="lbl">PATHS</div></div>'
    +'<div class="detail-stat"><div class="val">'+(node.out||0)+'</div><div class="lbl">OUTBOUND</div></div>'
    +'</div>'
    +'<div class="detail-label">IP Address</div>'
    +'<div class="detail-ip">'+(node.ip||'N/A')+'</div>'
    +'<div class="detail-label">Coordinates</div>'
    +'<div class="detail-value">'+(node.lat||0).toFixed(4)+', '+(node.lng||0).toFixed(4)+'</div>'
    +(nr.length
      ?'<div class="detail-label">IP Trail Paths</div>'+nr.slice(0,5).map(function(r){
          var hops=r.ip_path?r.ip_path.split(' -> '):[];
          var badges=hops.map(function(h,i){
            var ip=h.split('(')[0];
            var nd=h.match(/\(([^)]+)\)/);
            return (i>0?'<span class="hop-arrow">&#8594;</span>':'')
              +'<span class="ip-badge" title="'+(nd?nd[1]:ip)+'">'+ip+'</span>';
          }).join('');
          return '<div class="route-item">'
            +'<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
            +'<span style="font-size:10px;color:#7ec8f8">&larr; '+r.from+'</span>'
            +'<span style="font-size:10px;color:'+latencyColor(r.ms)+';font-weight:bold">'+r.ms.toFixed(3)+' ms</span>'
            +'</div>'
            +'<div style="font-size:9px;color:#5a7fa0;margin-bottom:4px">'
            +'Src: <span style="color:#4fc3f7">'+r.src_ip+'</span>'
            +' &nbsp; Dst: <span style="color:#4fc3f7">'+r.dest_ip+'</span></div>'
            +'<div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">'+badges+'</div></div>';
        }).join('')
      :'<div class="detail-value" style="color:#5a7fa0">No route data</div>');
  document.getElementById('detail-panel').classList.add('visible');
}

function closeDetail(){
  document.getElementById('detail-panel').classList.remove('visible');
  selectedNode=null; buildNodeList();
}

var rc=L.control({position:'topright'});
rc.onAdd=function(){
  var d=L.DomUtil.create('div');
  d.innerHTML='<button onclick="map.setView([38.5,-95.0],4)" '
    +'style="background:#0d1b2e;color:#4fc3f7;border:1px solid #1e3a6e;'
    +'padding:6px 10px;cursor:pointer;font-family:monospace;font-size:11px;border-radius:3px">'
    +'&#8962; RESET</button>';
  return d;
};
rc.addTo(map);

drawRoutes('all'); drawMarkers(); buildNodeList();
</script>
</body>
</html>
